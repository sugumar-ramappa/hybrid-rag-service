[project]
name = "hybrid-rag-service"
version = "0.1.0"
description = "A RAG pipeline exposed as an MCP server using Google ADK and Gemini"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "google-adk>=0.3.0",
    "google-generativeai>=0.8.0",
    "chromadb>=0.5.0",
    "langchain-text-splitters>=0.2.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
rag-mcp-server = "src.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
