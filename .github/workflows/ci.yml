name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The vector store tests run against real Postgres with real SQL, real
    # indexes and real upsert semantics. Mocking the database here would test
    # nothing worth testing - two of the three hardest bugs in this project were
    # Postgres behaviour (an assignment-cast asymmetry that let INSERT succeed
    # while the distance operator failed, and a type-registration deadlock on a
    # fresh database). Neither would survive contact with a mock.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TEST_DATABASE_URL, not DATABASE_URL. Every vector store test truncates
      # the chunks table, so it must point at a disposable database - pointing
      # it at a working corpus silently destroys it, which is exactly what
      # happened locally before this was separated.
      #
      # No API key: every test uses synthetic vectors, so CI never calls the
      # embedding API and never consumes quota.
      TEST_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ragdb_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create the disposable test database
        run: |
          PGPASSWORD=dev createdb -h localhost -U postgres ragdb_test

      - name: Lint
        run: ruff check src/ scripts/ tests/

      - name: Test
        run: pytest tests/ -v

      - name: Verify the golden set is still usable
        # Guards the evaluation set itself. A pull request that accidentally
        # drops verified questions, or leaves the file unparseable, would
        # otherwise only be discovered when the metrics moved for no reason.
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("eval/golden_set.json"))
          verified = [q for q in data["questions"] if q.get("verified")]
          styles = {q["style"] for q in verified}

          print(f"{len(verified)} verified of {len(data['questions'])}")
          print(f"styles: {sorted(styles)}")

          if len(verified) < 20:
              sys.exit(f"FAIL: only {len(verified)} verified questions - "
                       "below 20 the metrics are too noisy to act on")
          if len(styles) < 2:
              sys.exit("FAIL: both question styles are needed for the "
                       "per-style breakdown to mean anything")

          missing = [q["id"] for q in verified
                     if not q.get("expected_chunk_id") or not q.get("source")]
          if missing:
              sys.exit(f"FAIL: entries missing their expected chunk: {missing}")

          print("golden set OK")
          PY
